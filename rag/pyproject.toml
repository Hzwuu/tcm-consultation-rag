[project]
name = "tcm-consult-rag"
version = "0.1.0"
description = "A local TCM consultation assistant prototype with retrieval, multi-turn questioning, and safety triage."
requires-python = ">=3.10"
dependencies = [
  "streamlit>=1.30",
]

[project.optional-dependencies]
embedding = [
  "sentence-transformers>=2.7",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
